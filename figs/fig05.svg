<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="370" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">张力-速度关系与三种收缩形式</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">离心 &gt; 等长 &gt; 向心；负荷越大，向心收缩速度越慢（Hill 曲线）</tspan></text><line x1="84" y1="268" x2="404" y2="268" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/><line x1="84" y1="268" x2="84" y2="98" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/><text x="398" y="288" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#4a5568" text-anchor="end"><tspan x="398" dy="0">负荷（张力）→</tspan></text><text x="26" y="183" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#4a5568" text-anchor="middle" transform="rotate(-90 26 183)">缩短速度 →</text><path d="M90,110 C154,118 284,208 398,264" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="100" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start"><tspan x="118" dy="0">Vmax（负荷 = 0）</tspan></text><line x1="84" y1="86" x2="88" y2="86" stroke="none" stroke-width="1.2" stroke-linecap="round"/><text x="396" y="252" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#1d4ed8" text-anchor="end"><tspan x="396" dy="0">Fmax</tspan></text><line x1="398" y1="268" x2="398" y2="262" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><text x="234" y="168" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="middle"><tspan x="234" dy="0">向心收缩</tspan></text><rect x="456" y="66" width="428" height="66" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="456" y="66" width="6" height="66" rx="3" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="476" y="90" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="476" dy="0">向心收缩</tspan></text><text x="476" y="110" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#334155" text-anchor="start"><tspan x="476" dy="0">长度缩短 · 起止点靠近 · 做正功</tspan></text><text x="476" y="126" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#4a5568" text-anchor="start"><tspan x="476" dy="0">例：弯举上举、蹬伸</tspan></text><line x1="824" y1="112" x2="856" y2="88" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><line x1="824" y1="120" x2="856" y2="96" stroke="#1d4ed8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="824" cy="112" r="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="856" cy="88" r="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.4"/><rect x="456" y="144" width="428" height="66" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="456" y="144" width="6" height="66" rx="3" fill="#0f766e" stroke="none" stroke-width="1.2"/><text x="476" y="168" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13.5" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="476" dy="0">等长收缩</tspan></text><text x="476" y="188" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#334155" text-anchor="start"><tspan x="476" dy="0">张力增加 · 长度不变 · 不做机械功</tspan></text><text x="476" y="204" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#4a5568" text-anchor="start"><tspan x="476" dy="0">例：十字支撑、站桩、维持姿势</tspan></text><line x1="840" y1="160" x2="840" y2="196" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><path d="M820,164 l8,4 l0,8 z" fill="#0f766e"/><path d="M860,164 l-8,4 l0,8 z" fill="#0f766e"/><path d="M820,184 l8,4 l0,8 z" fill="#0f766e"/><path d="M860,184 l-8,4 l0,8 z" fill="#0f766e"/><rect x="456" y="222" width="428" height="66" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="456" y="222" width="6" height="66" rx="3" fill="#b42318" stroke="none" stroke-width="1.2"/><text x="476" y="246" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13.5" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="476" dy="0">离心收缩</tspan></text><text x="476" y="266" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#334155" text-anchor="start"><tspan x="476" dy="0">被拉长 · 起止点远离 · 做负功</tspan></text><text x="476" y="282" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#4a5568" text-anchor="start"><tspan x="476" dy="0">例：下蹲缓冲、下坡跑、放下杠铃</tspan></text><line x1="824" y1="244" x2="856" y2="268" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><line x1="824" y1="236" x2="856" y2="260" stroke="#b42318" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="824" cy="244" r="4" fill="#b42318" stroke="#b42318" stroke-width="1.4"/><circle cx="856" cy="268" r="4" fill="#b42318" stroke="#b42318" stroke-width="1.4"/><rect x="24" y="268" width="320" height="0" rx="6" fill="none" stroke="none" stroke-width="1.2"/><text x="84" y="322" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#4a5568" text-anchor="start"><tspan x="84" dy="0">相对力量：离心 ≈ 向心的 1.5 倍，等长 ≈ 向心的 1.25 倍</tspan></text><text x="450" y="356" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 5　张力-速度关系</tspan></text></svg>