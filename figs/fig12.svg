<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="382" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">心血管活动的调节：神经与体液</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">压力感受性与化学感受性反射的基本过程，基本中枢均在延髓</tspan></text><rect x="24" y="62" width="852" height="196" rx="8" fill="#fbfdff" stroke="#c9d2e0" stroke-width="1.2"/><rect x="28" y="82" width="164" height="100" rx="8" fill="#eaf0fd" stroke="#0369a1" stroke-width="1.2"/><text x="110" y="106" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#0369a1" font-weight="700" text-anchor="middle"><tspan x="110" dy="0">感受器</tspan></text><text x="110" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle"><tspan x="110" dy="0">颈动脉窦</tspan><tspan x="110" dy="15">主动脉弓压力感受器</tspan></text><rect x="218" y="82" width="164" height="100" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/><text x="300" y="106" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4338ca" font-weight="700" text-anchor="middle"><tspan x="300" dy="0">传入神经</tspan></text><text x="300" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle"><tspan x="300" dy="0">窦神经</tspan><tspan x="300" dy="15">降压神经</tspan></text><rect x="408" y="82" width="164" height="100" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="490" y="106" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="middle"><tspan x="490" dy="0">延髓心血管中枢</tspan></text><text x="490" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle"><tspan x="490" dy="0">心交感 / 心迷走</tspan><tspan x="490" dy="15">缩血管区</tspan></text><rect x="618" y="82" width="164" height="100" rx="8" fill="#e6f4ec" stroke="#0f766e" stroke-width="1.2"/><text x="700" y="106" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">传出与效应器</tspan></text><text x="700" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="middle"><tspan x="700" dy="0">心、血管</tspan><tspan x="700" dy="15">心输出量与外周阻力</tspan></text><line x1="194" y1="132" x2="216" y2="132" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahB)"/><line x1="384" y1="132" x2="406" y2="132" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahB)"/><line x1="574" y1="132" x2="616" y2="132" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahB)"/><path d="M782,182 L782,214 L110,214 L110,184" fill="none" stroke="#b42318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M110,184 l-5,10 l10,0 z" fill="#b42318"/><text x="446" y="236" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#b42318" text-anchor="middle"><tspan x="446" dy="0">负反馈：血压回升后感受器放电增加，抑制心血管中枢，恢复稳态</tspan></text><text x="446" y="252" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#4a5568" text-anchor="middle"><tspan x="446" dy="0">（血压↑ → 压力感受器放电↑ → 心迷走↑、心交感↓、缩血管↓ → 血压↓）</tspan></text><rect x="24" y="272" width="204" height="62" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="36" y="290" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="36" dy="0">肾上腺素</tspan></text><text x="36" y="308" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="36" dy="0">强心，心率与每搏量均增加</tspan></text><rect x="238" y="272" width="204" height="62" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="250" y="290" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="250" dy="0">去甲肾上腺素</tspan></text><text x="250" y="308" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="250" dy="0">强缩血管，血压明显升高，心率反射性减慢</tspan></text><rect x="452" y="272" width="204" height="62" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="464" y="290" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="464" dy="0">肾素-血管紧张素</tspan></text><text x="464" y="308" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="464" dy="0">收缩血管、促进醛固酮分泌，升压保钠</tspan></text><rect x="666" y="272" width="204" height="62" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="678" y="290" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="678" dy="0">血管升压素（ADH）</tspan></text><text x="678" y="308" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="678" dy="0">抗利尿 + 缩血管</tspan></text><text x="450" y="368" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 12　心血管调节</tspan></text></svg>