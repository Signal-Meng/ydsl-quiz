ont-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="125" dy="0">1　泛化阶段</tspan></text><text x="36" y="112" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10" fill="#1e40af" font-weight="700" text-anchor="start"><tspan x="36" dy="0">生理特点</tspan></text><text x="36" y="128" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#334155" text-anchor="start"><tspan x="36" dy="0">兴奋与抑制均扩散，内抑制未建立</tspan></text><text x="36" y="178" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10" fill="#1e40af" font-weight="700" text-anchor="start"><tspan x="36" dy="0">动作表现</tspan></text><text x="36" y="194" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#334155" text-anchor="start"><tspan x="36" dy="0">动作僵硬、不协调、多余动作多，</tspan><tspan x="36" dy="13">主要依靠视觉控制</tspan></text><text x="36" y="244" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10" fill="#1e40af" font-weight="700" text-anchor="start"><tspan x="36" dy="0">教学：</tspan></text><text x="70" y="244" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#475569" text-anchor="start"><tspan x="70" dy="0">正确示范、降低难度、</tspan></text><text x="36" y="260" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#475569" text-anchor="start"><tspan x="36" dy="0">防止形成错误定型</tspan></text><line x1="227" y1="176" x2="238" y2="176" stroke="#4a5568" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahG)"/><rect x="240" y="66" width="202" height="224" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="240" y="66" width="202" height="30" rx="8" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><rect x="240" y="88" width="202" height="8" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="341" y="86" font-family="'Microso