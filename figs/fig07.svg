i','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="307" dy="0">30~60 s</tspan></text><line x1="475" y1="106" x2="475" y2="112" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/><text x="475" y="126" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="475" dy="0">2~3 min</tspan></text><line x1="790" y1="106" x2="790" y2="112" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/><text x="790" y="126" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="790" dy="0">更久</tspan></text><line x1="90" y1="246" x2="790" y2="246" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><line x1="90" y1="246" x2="90" y2="168" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/><text x="782" y="268" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#4a5568" text-anchor="end"><tspan x="782" dy="0">时间 →</tspan></text><text x="34" y="208" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#4a5568" text-anchor="middle" transform="rotate(-90 34 208)">摄氧量 →</text><path d="M90,246 C130,240 160,198 220,188" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="220" y1="188" x2="780" y2="188" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round"/><rect x="92" y="188" width="132" height="52" rx="4" fill="#b42318" stroke="none" stroke-width="1.2" fill-opacity="0.08"/><text x="158" y="206" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#b42318" font-weight="700" text-anchor="middle"><tspan x="158" dy="0">氧亏</tspan></text><text x="158" y="222" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#4a5568" text-anchor="middle"><tspan x="158" dy="0">由 ATP-CP 与酵解补足</tspan></text