<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="404" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">氧离曲线：S 形与右移</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">上段平缓利于结合氧，下段陡峭利于释放氧；右移 = 释放更多 O₂</tspan></text><line x1="96" y1="300" x2="446" y2="300" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/><line x1="96" y1="300" x2="96" y2="100" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/><text x="446" y="334" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#4a5568" text-anchor="end"><tspan x="446" dy="0">PO₂（mmHg）→</tspan></text><text x="90" y="96" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#4a5568" text-anchor="start"><tspan x="90" dy="0">Hb 氧饱和度（%）↑</tspan></text><line x1="96" y1="300" x2="96" y2="305" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="96" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="96" dy="0">0</tspan></text><line x1="166" y1="300" x2="166" y2="305" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="166" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="166" dy="0">20</tspan></text><line x1="236" y1="300" x2="236" y2="305" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="236" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="236" dy="0">40</tspan></text><line x1="306" y1="300" x2="306" y2="305" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="306" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="306" dy="0">60</tspan></text><line x1="376" y1="300" x2="376" y2="305" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="376" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="376" dy="0">80</tspan></text><line x1="446" y1="300" x2="446" y2="305" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="446" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle"><tspan x="446" dy="0">100</tspan></text><line x1="91" y1="300" x2="96" y2="300" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="87" y="304" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="end"><tspan x="87" dy="0">0</tspan></text><line x1="91" y1="250" x2="96" y2="250" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="87" y="254" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="end"><tspan x="87" dy="0">25</tspan></text><line x1="91" y1="200" x2="96" y2="200" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="87" y="204" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="end"><tspan x="87" dy="0">50</tspan></text><line x1="91" y1="150" x2="96" y2="150" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="87" y="154" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="end"><tspan x="87" dy="0">75</tspan></text><line x1="91" y1="100" x2="96" y2="100" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/><text x="87" y="104" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.5" fill="#4a5568" text-anchor="end"><tspan x="87" dy="0">100</tspan></text><path d="M131,280 C173,210 215,156 271,126 C327,110 383,104 446,102" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M131,288 C180,244 229,188 285,142 C341,116 390,106 446,102" fill="none" stroke="#b42318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/><text x="320" y="176" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#1f7a52" font-weight="700" text-anchor="start"><tspan x="320" dy="0">上段（平缓）</tspan></text><text x="320" y="200" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10" fill="#1f7a52" text-anchor="start"><tspan x="320" dy="0">利于结合氧</tspan></text><rect x="96" y="120" width="210" height="180" rx="3" fill="#fdf3d8" stroke="#f0d9a0" stroke-width="1.2"/><text x="194" y="240" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#6b4a00" font-weight="700" text-anchor="middle"><tspan x="194" dy="0">下段 &lt;60</tspan></text><line x1="306" y1="300" x2="306" y2="100" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="306" y1="300" x2="306" y2="305" stroke="#b42318" stroke-width="1.6" stroke-linecap="round"/><text x="87" y="192" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#b42318" font-weight="700" text-anchor="end"><tspan x="87" dy="0">60</tspan></text><rect x="500" y="66" width="384" height="64" rx="8" fill="#e6f4ec" stroke="#1f7a52" stroke-width="1"/><text x="514" y="86" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1f7a52" font-weight="700" text-anchor="start"><tspan x="514" dy="0">上段（60~100 mmHg）</tspan></text><text x="514" y="104" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.9" fill="#334155" text-anchor="start"><tspan x="514" dy="0">坡度平缓。PO₂ 由 100 降至 80 mmHg，饱和度仅由 98% 降至 96%，</tspan><tspan x="514" dy="14">利于肺内结合氧，对高原与呼吸机能不全者有利</tspan></text><rect x="500" y="138" width="384" height="64" rx="8" fill="#fdf3d8" stroke="#6b4a00" stroke-width="1"/><text x="514" y="158" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#6b4a00" font-weight="700" text-anchor="start"><tspan x="514" dy="0">下段（&lt;60 mmHg）</tspan></text><text x="514" y="176" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.9" fill="#334155" text-anchor="start"><tspan x="514" dy="0">曲线陡峭。PO₂ 稍降即大量解离 O₂，利于代谢旺盛的组织供氧</tspan><tspan x="514" dy="14">（运动肌 PO₂ 可降至 20 mmHg 以下）</tspan></text><rect x="500" y="210" width="384" height="64" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1"/><text x="514" y="230" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="514" dy="0">右移（亲和力下降）</tspan></text><text x="514" y="248" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.9" fill="#334155" text-anchor="start"><tspan x="514" dy="0">PCO₂↑、pH↓、温度↑、2,3-DPG↑</tspan><tspan x="514" dy="14">→ 组织处释放更多 O₂。运动时四项同时发生</tspan></text><rect x="500" y="282" width="384" height="64" rx="8" fill="#eaf0fd" stroke="#1d4ed8" stroke-width="1"/><text x="514" y="302" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="514" dy="0">左移（亲和力升高）</tspan></text><text x="514" y="320" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.9" fill="#334155" text-anchor="start"><tspan x="514" dy="0">PCO₂↓、pH↑、温度↓、2,3-DPG↓</tspan><tspan x="514" dy="14">→ 肺内结合更多 O₂；库存血 2,3-DPG 减少即属此类</tspan></text><text x="96" y="352" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#4a5568" text-anchor="start"><tspan x="96" dy="0">CO 与 Hb 亲和力约为 O₂ 的 200 倍，竞争性结合造成组织缺氧</tspan></text><text x="96" y="370" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="96" dy="0">运动时曲线右移，是组织摄取更多氧的生理基础</tspan></text><text x="450" y="390" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 9　氧离曲线</tspan></text></svg>