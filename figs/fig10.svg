<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="342" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">肺通气量的时相变化</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">中等强度靠加深呼吸，剧烈运动靠加快频率；通气耗氧占比随之升高</tspan></text><line x1="96" y1="256" x2="496" y2="256" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/><line x1="96" y1="256" x2="96" y2="98" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/><text x="486" y="64" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#4a5568" text-anchor="end"><tspan x="486" dy="0">每分通气量（L/min）↑</tspan></text><text x="102" y="276" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.3" fill="#4a5568" text-anchor="start"><tspan x="102" dy="0">安静</tspan><tspan x="102" dy="13">6~8</tspan></text><text x="235" y="276" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.3" fill="#4a5568" text-anchor="middle"><tspan x="235" dy="0">中等</tspan><tspan x="235" dy="13">40~60</tspan></text><text x="375.6" y="276" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.3" fill="#4a5568" text-anchor="middle"><tspan x="375.6" dy="0">剧烈</tspan><tspan x="375.6" dy="13">80~150</tspan></text><text x="451.6" y="276" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.3" fill="#4a5568" text-anchor="middle"><tspan x="451.6" dy="0">最大</tspan><tspan x="451.6" dy="13">130~180</tspan></text><text x="296" y="314" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#4a5568" text-anchor="middle"><tspan x="296" dy="0">运动强度 →</tspan></text><path d="M100,238 C186,234 246,204 306,168 C376,132 426,116 492,108" fill="none" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="222" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#4a5568" text-anchor="start"><tspan x="104" dy="0">通气耗氧占 1%~2%</tspan></text><text x="346" y="156" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="346" dy="0">通气耗氧占比升至 8%~10%</tspan></text><rect x="528" y="74" width="356" height="50" rx="8" fill="#eaf0fd" stroke="#1d4ed8" stroke-width="1"/><text x="542" y="94" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="542" dy="0">潮气量</tspan></text><text x="542" y="112" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#334155" text-anchor="start"><tspan x="542" dy="0">500 mL → 2000 mL 以上</tspan></text><rect x="528" y="132" width="356" height="50" rx="8" fill="#e6f4ec" stroke="#0f766e" stroke-width="1"/><text x="542" y="152" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="542" dy="0">呼吸频率</tspan></text><text x="542" y="170" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#334155" text-anchor="start"><tspan x="542" dy="0">12~18 次/分 → 40~60 次/分</tspan></text><rect x="528" y="190" width="356" height="50" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1"/><text x="542" y="210" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="542" dy="0">每分通气量</tspan></text><text x="542" y="228" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#334155" text-anchor="start"><tspan x="542" dy="0">6~8 L → 80~150 L（增加 13~18 倍）</tspan></text><rect x="528" y="246" width="356" height="40" rx="6" fill="#f8fafc" stroke="#c9d2e0" stroke-width="1.2"/><text x="540" y="262" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="start"><tspan x="540" dy="0">长期训练：安静通气量不变；次最大强度通气量下降 20%~30%</tspan></text><text x="540" y="278" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="start"><tspan x="540" dy="0">（经济性提高）；最大通气量上升</tspan></text><text x="450" y="328" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 10　肺通气时相</tspan></text></svg>