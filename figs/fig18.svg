<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">极点与第二次呼吸</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">内脏器官惰性造成供氧滞后，是极点产生的根本原因；惰性被克服后出现第二次呼吸</tspan></text><line x1="96" y1="232" x2="526" y2="232" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><line x1="96" y1="232" x2="96" y2="62" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/><text x="311" y="262" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#4a5568" text-anchor="middle"><tspan x="311" dy="0">运动时间 →</tspan></text><line x1="156" y1="88" x2="520" y2="88" stroke="#b42318" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 4"/><text x="516" y="80" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#b42318" text-anchor="end"><tspan x="516" dy="0">需氧量</tspan></text><path d="M102,212 C136,206 158,186 192,154 C236,120 272,96 316,92" fill="none" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="316" y1="92" x2="520" y2="92" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/><text x="102" y="150" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="102" dy="0">摄氧量</tspan></text><circle cx="158" cy="186" r="5" fill="#b42318" stroke="#b42318" stroke-width="1.4"/><text x="166" y="218" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="166" dy="0">极点</tspan></text><line x1="160" y1="190" x2="166" y2="212" stroke="#b42318" stroke-width="1.2" stroke-linecap="round"/><text x="246" y="158" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#1f7a52" font-weight="700" text-anchor="start"><tspan x="246" dy="0">第二次呼吸</tspan></text><rect x="102" y="62" width="214" height="170" rx="4" fill="#fdf3d8" stroke="none" stroke-width="1.2" fill-opacity="0.3"/><text x="212" y="76" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#6b4a00" font-weight="700" text-anchor="middle"><tspan x="212" dy="0">供氧滞后 = 氧亏</tspan></text><rect x="566" y="66" width="312" height="108" rx="8" fill="#fdecea" stroke="#b42318" stroke-width="1"/><text x="580" y="88" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="580" dy="0">极点</tspan></text><text x="580" y="108" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 内脏器官生理惰性大，摄氧量跟不上需氧量</tspan></text><text x="580" y="122" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 乳酸堆积、pH 下降、内环境改变</tspan></text><text x="580" y="136" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 神经肌肉兴奋性下降，动作变形</tspan></text><text x="580" y="150" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 强烈冲动上行，动力定型暂时破坏</tspan></text><text x="580" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 主观：胸闷、气促、腿沉、想停</tspan></text><rect x="566" y="182" width="312" height="108" rx="8" fill="#e6f4ec" stroke="#1f7a52" stroke-width="1"/><text x="580" y="204" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#1f7a52" font-weight="700" text-anchor="start"><tspan x="580" dy="0">第二次呼吸</tspan></text><text x="580" y="224" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 内脏惰性被克服，氧供应增加</tspan></text><text x="580" y="238" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 乳酸逐步清除，内环境改善</tspan></text><text x="580" y="252" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 强度暂时性下降后重新上升</tspan></text><text x="580" y="266" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 肾上腺素分泌增加，机能动员</tspan></text><text x="580" y="280" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#334155" text-anchor="start"><tspan x="580" dy="0">· 主观：呼吸顺畅、动作轻快</tspan></text><text x="96" y="288" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.4" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="96" dy="0">应对：继续坚持、调整呼吸节奏、适当降低强度；不可立即停止（防止静脉回流骤降）</tspan></text><text x="450" y="316" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 18　极点与第二次呼吸</tspan></text></svg>