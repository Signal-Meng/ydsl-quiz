76" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13.2" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="604" dy="0">酵解能系统</tspan></text><text x="604" y="195" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#334155" text-anchor="start"><tspan x="604" dy="0">底物：肌糖原/葡萄糖</tspan></text><text x="604" y="212" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#334155" text-anchor="start"><tspan x="604" dy="0">时限 30 s~3 min ｜ 功率 较大</tspan></text><text x="604" y="226" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#4a5568" text-anchor="start"><tspan x="604" dy="0">无氧、产乳酸</tspan></text><rect x="590" y="238" width="296" height="74" rx="8" fill="#e6f4ec" stroke="#1f7a52" stroke-width="1.1"/><text x="604" y="260" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13.2" fill="#1f7a52" font-weight="700" text-anchor="start"><tspan x="604" dy="0">氧化能系统</tspan></text><text x="604" y="279" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#334155" text-anchor="start"><tspan x="604" dy="0">底物：糖、脂肪、蛋白质</tspan></text><text x="604" y="296" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#334155" text-anchor="start"><tspan x="604" dy="0">时限 数分钟以上 ｜ 功率 约酵解的 1/2</tspan></text><text x="604" y="310" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#4a5568" text-anchor="start"><tspan x="604" dy="0">有氧、产物为 CO₂ 与 H₂O</tspan></text><text x="86" y="358" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="86" dy="0">三个系统构成“能量连续统一体”，任何项目均按比例协同供能</tspan></text><text x="450" y="382" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 6　三大能源系统</tspan></text></svg>