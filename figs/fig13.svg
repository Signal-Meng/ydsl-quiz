<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">运动时心输出量的重新分配</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">总血量增加 3~4 倍，但分配高度不均：骨骼肌与心肌增加，内脏减少</tspan></text><text x="24" y="70" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="24" dy="0">安静（心输出量 5 L/min）</tspan></text><rect x="24" y="82" width="104" height="32" rx="0" fill="#93c5fd" stroke="#ffffff" stroke-width="1.4"/><text x="76" y="103" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#1f2937" font-weight="700" text-anchor="middle"><tspan x="76" dy="0">20%</tspan></text><rect x="128" y="82" width="286" height="32" rx="0" fill="#cbd5e1" stroke="#ffffff" stroke-width="1.4"/><text x="271" y="103" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#1f2937" font-weight="700" text-anchor="middle"><tspan x="271" dy="0">55%</tspan></text><rect x="414" y="82" width="78" height="32" rx="0" fill="#6ee7b7" stroke="#ffffff" stroke-width="1.4"/><text x="453" y="103" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#1f2937" font-weight="700" text-anchor="middle"><tspan x="453" dy="0">15%</tspan></text><rect x="492" y="82" width="26" height="32" rx="0" fill="#fbbf24" stroke="#ffffff" stroke-width="1.4"/><rect x="518" y="82" width="26" height="32" rx="0" fill="#e2e8f0" stroke="#ffffff" stroke-width="1.4"/><rect x="24" y="122" width="11" height="9" rx="2" fill="#93c5fd" stroke="none" stroke-width="1.2"/><text x="40" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="40" dy="0">骨骼肌</tspan></text><rect x="128" y="122" width="11" height="9" rx="2" fill="#cbd5e1" stroke="none" stroke-width="1.2"/><text x="144" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="144" dy="0">内脏</tspan></text><rect x="232" y="122" width="11" height="9" rx="2" fill="#6ee7b7" stroke="none" stroke-width="1.2"/><text x="248" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="248" dy="0">脑</tspan></text><rect x="336" y="122" width="11" height="9" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.2"/><text x="352" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="352" dy="0">心肌</tspan></text><rect x="440" y="122" width="11" height="9" rx="2" fill="#e2e8f0" stroke="none" stroke-width="1.2"/><text x="456" y="130" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="456" dy="0">其他</tspan></text><text x="24" y="156" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="24" dy="0">最大运动（心输出量 20~25 L/min）</tspan></text><rect x="24" y="168" width="416" height="32" rx="0" fill="#3b82f6" stroke="#ffffff" stroke-width="1.4"/><text x="232" y="189" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#1f2937" font-weight="700" text-anchor="middle"><tspan x="232" dy="0">80%</tspan></text><rect x="440" y="168" width="41.6" height="32" rx="0" fill="#cbd5e1" stroke="#ffffff" stroke-width="1.4"/><rect x="481.6" y="168" width="20.8" height="32" rx="0" fill="#34d399" stroke="#ffffff" stroke-width="1.4"/><rect x="502.4" y="168" width="26" height="32" rx="0" fill="#f59e0b" stroke="#ffffff" stroke-width="1.4"/><rect x="528.4" y="168" width="15.6" height="32" rx="0" fill="#e2e8f0" stroke="#ffffff" stroke-width="1.4"/><rect x="24" y="208" width="11" height="9" rx="2" fill="#3b82f6" stroke="none" stroke-width="1.2"/><text x="40" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="40" dy="0">骨骼肌</tspan></text><rect x="128" y="208" width="11" height="9" rx="2" fill="#cbd5e1" stroke="none" stroke-width="1.2"/><text x="144" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="144" dy="0">内脏</tspan></text><rect x="232" y="208" width="11" height="9" rx="2" fill="#34d399" stroke="none" stroke-width="1.2"/><text x="248" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="248" dy="0">脑</tspan></text><rect x="336" y="208" width="11" height="9" rx="2" fill="#f59e0b" stroke="none" stroke-width="1.2"/><text x="352" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="352" dy="0">心肌</tspan></text><rect x="440" y="208" width="11" height="9" rx="2" fill="#e2e8f0" stroke="none" stroke-width="1.2"/><text x="456" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="456" dy="0">其他</tspan></text><rect x="570" y="70" width="308" height="66" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="570" y="70" width="4" height="66" rx="2" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="584" y="90" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="584" dy="0">机制</tspan></text><text x="584" y="110" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.6" fill="#475569" text-anchor="start"><tspan x="584" dy="0">交感神经使内脏、皮肤血管收缩；</tspan><tspan x="584" dy="12">骨骼肌阻力血管在交感胆碱能纤维</tspan><tspan x="584" dy="12">作用下扩张（先收缩后扩张）</tspan></text><rect x="570" y="144" width="308" height="66" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="570" y="144" width="4" height="66" rx="2" fill="#0f766e" stroke="none" stroke-width="1.2"/><text x="584" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="584" dy="0">意义</tspan></text><text x="584" y="184" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.6" fill="#475569" text-anchor="start"><tspan x="584" dy="0">保证工作肌的氧与底物供应；</tspan><tspan x="584" dy="12">同时通过皮肤血管扩张散热</tspan></text><rect x="570" y="218" width="308" height="66" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="570" y="218" width="4" height="66" rx="2" fill="#b42318" stroke="none" stroke-width="1.2"/><text x="584" y="238" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="584" dy="0">代价</tspan></text><text x="584" y="258" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.6" fill="#475569" text-anchor="start"><tspan x="584" dy="0">内脏血流减少 → 消化吸收抑制；</tspan><tspan x="584" dy="12">肾血流下降 → 运动性蛋白尿与血尿</tspan></text><text x="24" y="288" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.4" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="24" dy="0">记忆：血量不减，只是“搬家”——从内脏搬到肌肉与皮肤</tspan></text><text x="450" y="316" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 13　血液重新分配</tspan></text></svg>