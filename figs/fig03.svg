ca" font-weight="700" text-anchor="middle"><tspan x="192" dy="0">ACh</tspan></text><circle cx="186" cy="204" r="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.3"/><text x="186" y="207.4" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="7.4" fill="#4338ca" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">ACh</tspan></text><rect x="124" y="236" width="300" height="22" rx="0" fill="#fef9e7" stroke="#eadfb8" stroke-width="1.2"/><text x="388" y="230" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#7a5b00" text-anchor="end"><tspan x="388" dy="0">接头间隙 ≈ 50 nm（含胆碱酯酶）</tspan></text><path d="M116,258 L424,258 L424,282 Q270,296 116,282 Z" fill="#fee2e2" stroke="#f87171" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="278" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#991b1b" font-weight="700" text-anchor="middle"><tspan x="270" dy="0">接头后膜（运动终板）</tspan></text><path d="M154,258 q8,-13 16,0" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M202,258 q8,-13 16,0" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,258 q8,-13 16,0" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M298,258 q8,-13 16,0" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M346,258 q8,-13 16,0" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M394,258 q8,-13 16,0" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="224" y="152" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="224" dy="0">Ca²⁺</tspan></text><path d="M248,148 l11,-5 l0,10 z" fill="#7c3aed"/><path d="M248,170 l11,-5 l0,10 z" fill="#7c3aed"/><circle cx="44" cy="152" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/><text x="44" y="156.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="44" dy="0">1</tspan></text><text x="58" y="148" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#4a5568" text-anchor="start"><tspan x="58" dy="0">动作电位</tspan><tspan x="58" dy="12">传至末梢</tspan></text><circle cx="44" cy="198" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/><text x="44" y="202.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="44" dy="0">2</tspan></text><text x="58" y="194" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="58" dy="0">Ca²⁺</tspan><tspan x="58" dy="12">内流</tspan></text><circle cx="44" cy="244" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/><text x="44" y="248.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="44" dy="0">3</tspan></text><text x="58" y="240" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.8" fill="#4338ca" text-anchor="start"><tspan x="58" dy="0">小泡融合</tspan><tspan x="58" dy="12">并释放</tspan></text><rect x="428" y="62" width="448" height="222" rx="8" fill="#f8fafc" stroke="#c9d2e0" stroke-width="1.2"/><text x="444" y="86" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="444" dy="0">传递结果与阻断</tspan></text><circle cx="454" cy="99" r="11" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="454" y="103.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="454" dy="0">④</tspan></text><text x="472" y="104" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.6" fill="#b91c1c" font-weight="700" text-anchor="start"><tspan x="472" dy="0">ACh 与受体结合</tspan></text><text x="472" y="121" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="472" dy="0">终板膜对 Na⁺、K⁺ 通透性改变，Na⁺ 内流为主，产生终板电位</tspan></text><circle cx="454" cy="143" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/><text x="454" y="147.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="454" dy="0">⑤</tspan></text><text x="472" y="148" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.6" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="472" dy="0">终板电位 → 动作电位</tspan></text><text x="472" y="165" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="472" dy="0">终板电位为局部电位，可总和；达阈电位后引发肌细胞动作电位</tspan></text><circle cx="454" cy="187" r="11" fill="#0f766e" stroke="#0f766e" stroke-width="0"/><text x="454" y="191.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="454" dy="0">⑥</tspan></text><text x="472" y="192" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.6" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="472" dy="0">ACh 被胆碱酯酶水解</tspan></text><text x="472" y="209" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="472" dy="0">保证一次神经冲动只引起一次肌肉收缩</tspan></text><text x="472" y="236" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.6" fill="#92400e" font-weight="700" text-anchor="start"><tspan x="472" dy="0">阻断与中毒</tspan></text><text x="472" y="253" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="472" dy="0">箭毒阻断受体；有机磷抑制胆碱酯酶致 ACh 堆积</tspan></text><text x="24" y="306" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.4" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="24" dy="0">记忆链：动作电位 → Ca²⁺ 内流 → 小泡释放 ACh → 受体结合 → 终板电位 → 肌膜动作电位 → ACh 水解</tspan></text><text x="450" y="332" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 3　神经-肌肉接头</tspan></text></svg>