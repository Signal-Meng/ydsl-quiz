<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="374" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">运动处方的 FITT-VP 六要素</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">健康成年人有氧运动的基本推荐；具体数值须按对象的机能水平与风险等级调整</tspan></text><rect x="24" y="70" width="418" height="68" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="24" y="70" width="44" height="68" rx="8" fill="#eaf0fd" stroke="none" stroke-width="1.2"/><text x="46" y="112" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="middle"><tspan x="46" dy="0">F</tspan></text><text x="80" y="92" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="80" dy="0">频率 Frequency</tspan></text><text x="256" y="92" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="256" dy="0">3~5 次/周</tspan></text><text x="80" y="110" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="80" dy="0">有氧：≥3 次/周；抗阻：2~3 次/周</tspan><tspan x="80" dy="13">柔韧：≥2~3 次/周</tspan></text><rect x="458" y="70" width="418" height="68" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="458" y="70" width="44" height="68" rx="8" fill="#fdecea" stroke="none" stroke-width="1.2"/><text x="480" y="112" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="24" fill="#b42318" font-weight="700" text-anchor="middle"><tspan x="480" dy="0">I</tspan></text><text x="514" y="92" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="514" dy="0">强度 Intensity</tspan></text><text x="690" y="92" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="690" dy="0">中等到较大</tspan></text><text x="514" y="110" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="514" dy="0">40%~59% HRR 或 64%~76% HRmax（中等）</tspan><tspan x="514" dy="13">60%~89% HRR 或 77%~93% HRmax（较大）</tspan><tspan x="514" dy="13">或 RPE 12~16</tspan></text><rect x="24" y="148" width="418" height="68" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="24" y="148" width="44" height="68" rx="8" fill="#e6f4ec" stroke="none" stroke-width="1.2"/><text x="46" y="190" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="46" dy="0">T</tspan></text><text x="80" y="170" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="80" dy="0">时间 Time</tspan></text><text x="256" y="170" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="256" dy="0">30~60 min/次</tspan></text><text x="80" y="188" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="80" dy="0">累计 150 min/周（中等）或 75 min/周（较大）</tspan><tspan x="80" dy="13">单次不足 10 min 也应累计</tspan></text><rect x="458" y="148" width="418" height="68" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="458" y="148" width="44" height="68" rx="8" fill="#f3ecfe" stroke="none" stroke-width="1.2"/><text x="480" y="190" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="24" fill="#7c3aed" font-weight="700" text-anchor="middle"><tspan x="480" dy="0">T</tspan></text><text x="514" y="170" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="514" dy="0">方式 Type</tspan></text><text x="690" y="170" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="690" dy="0">有节律的大肌群运动</tspan></text><text x="514" y="188" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="514" dy="0">走、跑、游泳、骑车、跳绳</tspan><tspan x="514" dy="13">辅以抗阻、柔韧与平衡练习</tspan></text><rect x="24" y="226" width="418" height="68" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="24" y="226" width="44" height="68" rx="8" fill="#fdf3d8" stroke="none" stroke-width="1.2"/><text x="46" y="268" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="24" fill="#92400e" font-weight="700" text-anchor="middle"><tspan x="46" dy="0">V</tspan></text><text x="80" y="248" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#92400e" font-weight="700" text-anchor="start"><tspan x="80" dy="0">总量 Volume</tspan></text><text x="256" y="248" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="256" dy="0">≥500~1000 MET·min/周</tspan></text><text x="80" y="266" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="80" dy="0">由频率、强度、时间共同决定</tspan></text><rect x="458" y="226" width="418" height="68" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="458" y="226" width="44" height="68" rx="8" fill="#eef1f5" stroke="none" stroke-width="1.2"/><text x="480" y="268" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="24" fill="#4a5568" font-weight="700" text-anchor="middle"><tspan x="480" dy="0">P</tspan></text><text x="514" y="248" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" font-weight="700" text-anchor="start"><tspan x="514" dy="0">进阶 Progression</tspan></text><text x="690" y="248" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="690" dy="0">循序渐进</tspan></text><text x="514" y="266" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#475569" text-anchor="start"><tspan x="514" dy="0">先增时间，再增强度；每 1~2 周调整一项</tspan></text><rect x="24" y="298" width="852" height="32" rx="6" fill="#fdf3d8" stroke="#f0d9a0" stroke-width="1.2"/><text x="38" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.4" fill="#6b4a00" font-weight="700" text-anchor="start"><tspan x="38" dy="0">靶心率（Karvonen 法）=（最大心率 − 安静心率）× 目标强度% + 安静心率</tspan></text><text x="600" y="318" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.4" fill="#6b4a00" font-weight="700" text-anchor="start"><tspan x="600" dy="0">最大心率 ≈ 220 − 年龄</tspan></text><text x="450" y="360" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 19　运动处方 FITT-VP</tspan></text></svg>