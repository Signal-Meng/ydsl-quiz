<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="372" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">牵张反射：肌梭与腱梭的分工</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">肌梭与梭外肌并联感受长度；腱梭与之串联感受张力，作用方向相反</tspan></text><text x="24" y="74" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="24" dy="0">肌梭（与肌纤维并联）→ 牵张反射</tspan></text><path d="M60,114 H300" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,114 H300" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="180" cy="114" rx="46" ry="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="180" y="118" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#1e40af" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">肌梭</tspan></text><text x="214" y="136" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#4a5568" text-anchor="start"><tspan x="214" dy="0">Ia 类传入纤维</tspan></text><line x1="180" y1="130" x2="180" y2="160" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahB)"/><rect x="120" y="162" width="120" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="180" y="184" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#1e40af" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">脊髓 α 运动神经元</tspan></text><line x1="180" y1="196" x2="180" y2="206" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahB)"/><text x="180" y="224" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.2" fill="#1e40af" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">同一肌肉收缩（被牵拉即收缩）</tspan></text><text x="320" y="114" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#334155" text-anchor="start"><tspan x="320" dy="0">牵张反射类型：腱反射（快速牵拉，单突触）</tspan><tspan x="320" dy="17">肌紧张（缓慢持续牵拉，多突触，维持姿势）</tspan></text><text x="320" y="176" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#4a5568" text-anchor="start"><tspan x="320" dy="0">感受器：肌梭　｜　效应：同一肌肉的梭外肌纤维</tspan></text><text x="24" y="260" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#b42318" font-weight="700" text-anchor="start"><tspan x="24" dy="0">腱梭（与肌纤维串联）→ 反牵张抑制</tspan></text><path d="M60,272 H300" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="272" rx="14" ry="16" fill="#fee2e2" stroke="#b42318" stroke-width="1.6"/><text x="290" y="276" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle"><tspan x="290" dy="0">腱梭</tspan></text><line x1="290" y1="290" x2="290" y2="308" stroke="#b42318" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahR)"/><text x="300" y="312" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#b42318" text-anchor="start"><tspan x="300" dy="0">Ib 传入 → 抑制同一肌肉 α 运动神经元</tspan></text><text x="470" y="270" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#4a5568" text-anchor="start"><tspan x="470" dy="0">张力过大时抑制自身收缩，具有保护意义</tspan></text><text x="470" y="298" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#0f766e" text-anchor="start"><tspan x="470" dy="0">运动应用：跳深、弹跳利用肌梭的牵张反射与弹性回缩</tspan></text><text x="450" y="358" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 14　牵张反射</tspan></text></svg>