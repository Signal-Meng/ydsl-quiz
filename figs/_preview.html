nt-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10" fill="#1f7a52" text-anchor="start"><tspan x="320" dy="0">利于结合氧</tspan></text><rect x="96" y="120" width="210" height="180" rx="3" fill="#fdf3d8" stroke="#f0d9a0" stroke-width="1.2"/><text x="194" y="240" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#6b4a00" font-weight="700" text-anchor="middle"><tspan x="194" dy="0">下段 &lt;60</tspan></text><line x1="306" y1="300" x2="306" y2="100" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="306" y1="300" x2="306" y2="305" stroke="#b42318" stroke-width="1.6" stroke-linecap="round"/><text x="87" y="192" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.2" fill="#b42318" font-weight="700" text-anchor="end"><tspan x="87" dy="0">60</tspan></text><rect x="500" y="66" width="384" height="64" rx="8" fill="#e6f4ec" stroke="#1f7a52" stroke-width="1"/><text x="514" y="86" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#1f7a52" font-weight="700" text-anchor="start"><tspan x="514" dy="0">上段（60~100 mmHg）</tspan></text><text x="514" y="104" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.9" fill="#334155" text-anchor="start"><tspan x="514" dy="0">坡度平缓。PO₂ 由 100 降至 80 mmHg，饱和度仅由 98% 降至 96%，</tspan><tspan x="514" dy="14">利于肺内结合氧，对高原与呼吸机能不全者有利</tspan></text><rect x="500" y="138" width="384" height="64" rx="8" fill="#fdf3d8" stroke="#6b4a00" stroke-width="1"/><text x="514" y="158" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#6b4a00" font-weight="700" text-anchor="start"><tspan x="514" dy="0">下段（&lt;60 mmHg）</tspan></text><text x="514" y="176" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.9" fill="#334155" text-anchor="start"><tspan x="514" dy="0">曲线陡峭。PO₂ 稍降即大量解离 O₂，利于代谢旺盛的组织供氧</tspan><tspan x="514" dy="14">（运动肌 PO₂ 可降至 nt-size="10.4" fill="#475569" text-anchor="start"><tspan x="144" dy="0">内脏</tspan></text><rect x="232" y="208" width="11" height="9" rx="2" fill="#34d399" stroke="none" stroke-width="1.2"/><text x="248" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="248" dy="0">脑</tspan></text><rect x="336" y="208" width="11" height="9" rx="2" fill="#f59e0b" stroke="none" stroke-width="1.2"/><text x="352" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="352" dy="0">心肌</tspan></text><rect x="440" y="208" width="11" height="9" rx="2" fill="#e2e8f0" stroke="none" stroke-width="1.2"/><text x="456" y="216" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.4" fill="#475569" text-anchor="start"><tspan x="456" dy="0">其他</tspan></text><rect x="570" y="70" width="308" height="66" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="570" y="70" width="4" height="66" rx="2" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="584" y="90" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="584" dy="0">机制</tspan></text><text x="584" y="110" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9.6" fill="#475569" text-anchor="start"><tspan x="584" dy="0">交感神经使内脏、皮肤血管收缩；</tspan><tspan x="584" dy="12">骨骼肌阻力血管在交感胆碱能纤维</tspan><tspan x="584" dy="12">作用下扩张（先收缩后扩张）</tspan></text><rect x="570" y="144" width="308" height="66" rx="6" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><rect x="570" y="144" width="4" height="66" rx="2" fill="#0f766e" stroke="none" stroke-width="1.2"/><text x="584" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.8" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="584" dy="0">意义</tspan></text><text
