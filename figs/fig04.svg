<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="100%"><defs><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="ahK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><pattern id="pJT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8a8a" stroke-width="2.4"/></pattern><pattern id="pDots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><circle cx="2.2" cy="2.2" r="1.25" fill="#7a7a7a"/><circle cx="6.2" cy="6.2" r="1.25" fill="#7a7a7a"/></pattern></defs><rect x="0" y="0" width="900" height="346" fill="#ffffff"/><text x="14" y="26" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="19" fill="#14357a" font-weight="700" text-anchor="start"><tspan x="14" dy="0">兴奋-收缩耦联三步与三联管</tspan></text><text x="14" y="46" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="14" dy="0">电信号（动作电位）转换为机械活动（肌丝滑行）的中介过程</tspan></text><rect x="24" y="62" width="356" height="200" rx="8" fill="#fbfdff" stroke="#c9d2e0" stroke-width="1.2"/><text x="38" y="84" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#0369a1" font-weight="700" text-anchor="start"><tspan x="38" dy="0">肌细胞膜</tspan></text><path d="M38,92 C120,92 240,92 366,92" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M104,92 L104,150 Q104,176 130,176 L250,176 Q276,176 276,150 L276,92" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="196" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#0369a1" text-anchor="middle"><tspan x="190" dy="0">横小管（T 管）</tspan></text><path d="M60,120 Q48,120 48,150 Q48,184 76,184 L104,184" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M316,120 Q328,120 328,184 L276,184" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="60" y="226" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#6d28d9" text-anchor="start"><tspan x="60" dy="0">纵小管（肌质网）· 钙泵回收 Ca²⁺</tspan></text><ellipse cx="158" cy="138" rx="40" ry="17" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/><text x="158" y="142" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#6d28d9" text-anchor="middle"><tspan x="158" dy="0">终末池</tspan></text><ellipse cx="222" cy="138" rx="40" ry="17" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/><text x="222" y="142" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.6" fill="#6d28d9" text-anchor="middle"><tspan x="222" dy="0">终末池</tspan></text><text x="190" y="118" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11" fill="#6d28d9" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">三联管 = 1 条横小管 + 2 个终末池</tspan></text><text x="142" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle"><tspan x="142" dy="0">Ca²⁺</tspan></text><text x="174" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle"><tspan x="174" dy="0">Ca²⁺</tspan></text><text x="206" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle"><tspan x="206" dy="0">Ca²⁺</tspan></text><text x="238" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle"><tspan x="238" dy="0">Ca²⁺</tspan></text><rect x="24" y="268" width="356" height="32" rx="6" fill="#fdf3d8" stroke="#f0d9a0" stroke-width="1.2"/><text x="38" y="289" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#6b4a00" text-anchor="start"><tspan x="38" dy="0">关键判据：胞质 Ca²⁺ 升高是收缩的直接触发因素，其来源为终末池</tspan></text><rect x="398" y="66" width="478" height="64" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><circle cx="420" cy="86" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/><text x="420" y="90.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">1</tspan></text><text x="440" y="90" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="start"><tspan x="440" dy="0">横小管传递</tspan></text><text x="440" y="110" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="start"><tspan x="440" dy="0">动作电位沿肌膜 → T 管 → 三联管，深入肌细胞内部</tspan></text><line x1="420" y1="98" x2="420" y2="136" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahB)"/><rect x="398" y="140" width="478" height="64" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><circle cx="420" cy="160" r="11" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="420" y="164.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">2</tspan></text><text x="440" y="164" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="440" dy="0">Ca²⁺ 释放与结合</tspan></text><text x="440" y="184" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="start"><tspan x="440" dy="0">终末池 Ca²⁺ 通道开放 → 肌浆 Ca²⁺ 浓度升高 → 与肌钙蛋白结合</tspan><tspan x="440" dy="15">→ 原肌球蛋白变构 → 肌动蛋白活性位点暴露 → 横桥摆动、细肌丝滑行</tspan></text><line x1="420" y1="172" x2="420" y2="210" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahG)"/><rect x="398" y="214" width="478" height="64" rx="8" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><circle cx="420" cy="234" r="11" fill="#0f766e" stroke="#0f766e" stroke-width="0"/><text x="420" y="238.5" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">3</tspan></text><text x="440" y="238" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="13" fill="#0f766e" font-weight="700" text-anchor="start"><tspan x="440" dy="0">Ca²⁺ 回收与舒张</tspan></text><text x="440" y="258" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="10.8" fill="#334155" text-anchor="start"><tspan x="440" dy="0">肌质网钙泵逆浓度把 Ca²⁺ 泵回终末池 → 与肌钙蛋白分离 → 肌肉舒张</tspan></text><text x="450" y="332" font-family="'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif" font-size="11.5" fill="#7b8798" text-anchor="middle"><tspan x="450" dy="0">图 4　兴奋-收缩耦联</tspan></text></svg>